/* ---------- verification badge — the signature element ---------- */
function Badge({ kind, children }) {
  const map = {
    confirmed: { bg: C.confirmedBg, fg: C.confirmed, label: "확인됨" },
    verify: { bg: C.verifyBg, fg: C.verify, label: "확인 필요" },
    note: { bg: C.noteBg, fg: C.note, label: "통화 안내" },
  };
  const s = map[kind] || map.note;
  return (
    <span
      className="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-medium"
      style={{ background: s.bg, color: s.fg }}
    >
      <Circle size={6} fill={s.fg} stroke="none" />
      {children || s.label}
    </span>
  );
}

function ToggleBadge({ kind, onToggle }) {
  const map = {
    confirmed: { bg: C.confirmedBg, fg: C.confirmed, label: "확인됨" },
    verify: { bg: C.verifyBg, fg: C.verify, label: "확인 필요" },
  };
  const s = map[kind] || map.verify;
  return (
    <button
      type="button"
      onClick={onToggle}
      className="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-[11px] font-semibold shrink-0"
      style={{ background: s.bg, color: s.fg }}
      title="눌러서 확인됨/확인 필요 전환"
    >
      <Circle size={6} fill={s.fg} stroke="none" />
      {s.label}
    </button>
  );
}

function EditableRow({ label, value, onChange, kind, onToggleKind, numeric, type = "text" }) {
  const isDate = type === "date";
  return (
    <div className="grid items-center gap-3 py-2 border-b" style={{ gridTemplateColumns: "58px minmax(0,1fr) 80px", borderColor: C.border }}>
      <span className="text-[11px] whitespace-nowrap" style={{ color: C.inkSoft }}>{label}</span>
      <input
        type={type}
        value={value}
        onChange={e => onChange(e.target.value)}
        className={`text-[11px] font-medium px-2 py-1 rounded-md outline-none ${isDate ? "text-left" : "text-right"}`}
        style={{ ...(numeric && !isDate ? mono : {}), border: `1px solid ${C.border}`, background: C.surfaceAlt, color: C.ink, width: "100%", minWidth: 0, boxSizing: "border-box" }}
      />
      <div className="flex justify-end">
        <ToggleBadge kind={kind} onToggle={onToggleKind} />
      </div>
    </div>
  );
}

function ToggleBadge3({ kind, onToggle }) {
  const order = ["confirmed", "verify", "note"];
  const map = {
    confirmed: { bg: C.confirmedBg, fg: C.confirmed, label: "확인됨" },
    verify: { bg: C.verifyBg, fg: C.verify, label: "확인 필요" },
    note: { bg: C.noteBg, fg: C.note, label: "통화 안내" },
  };
  const s = map[kind] || map.verify;
  const cycle = () => {
    const i = order.indexOf(kind);
    onToggle(order[(i + 1) % order.length]);
  };
  return (
    <button
      type="button"
      onClick={cycle}
      className="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-[11px] font-semibold shrink-0"
      style={{ background: s.bg, color: s.fg }}
      title="눌러서 확인됨 → 확인 필요 → 통화 안내 순서로 전환"
    >
      <Circle size={6} fill={s.fg} stroke="none" />
      {s.label}
    </button>
  );
}

function EditableResultRow({ label, value, onChange, kind, onToggleKind, numeric }) {
  return (
    <div className="flex items-center justify-between gap-3 py-2 border-b" style={{ borderColor: C.border }}>

          style={{ ...(numeric ? mono : {}), border: `1px solid ${C.border}`, background: C.surfaceAlt, color: C.ink }}
        />
        <ToggleBadge3 kind={kind} onToggle={onToggleKind} />
      </div>
    </div>
  );
}

        <Badge kind={kind} />
      </span>
    </div>
  );
}

/* ---------- call-summary regex parser (rule-based demo) ---------- */
function parseSummary(text) {
  const out = { fields: {}, badges: {}, name: "", phone4: "", fc: "", branch: "", rrnDetected: false };

  // 하단 마커 입력 지원: "**지점명" / "***FC명" — 지점·FC가 문맥상 누락될 때를 대비한 명시적 입력 방식 (최우선 인식)
  const branchMarkerMatch = text.match(/\*\*(?!\*)\s*([^\s,*]+)/);
  if (branchMarkerMatch) { out.branch = branchMarkerMatch[1]; out.badges.branch = "confirmed"; }
  const fcMarkerMatch = text.match(/\*\*\*\s*([^\s,*]+)/);

  // 이름 추출: "고객:이름" / "고객 이름" 라벨 형식을 우선 인식, 없으면 대화체("이름 고객하고 통화") fallback
  const labeledNameMatch =
    text.match(/고객\s*[:：]\s*([가-힣]{2,4})/) ||
    text.match(/고객\s+([가-힣]{2,4})(?!\s*(?:하고|와|과|님|은|는|이|가))/);
  const conversationalNameMatch =
    text.match(/^([가-힣]{2,4})\s*(?:고객|님)?(?:하고|와|과)?\s*통화/) ||
    text.match(/([가-힣]{2,4})\s*고객/);
  const nameMatch = labeledNameMatch || conversationalNameMatch;
  if (nameMatch) { out.name = nameMatch[1]; out.badges.name = "confirmed"; }

  // 고객명 뒤 6자리 숫자 = 주민번호 앞자리로 인식. 단, 개인정보 최소화 원칙상 실제 숫자는 저장하지 않고 감지 여부만 표시
  if (nameMatch) {
    const windowStart = nameMatch.index + nameMatch[0].length;
    const afterName = text.slice(windowStart, windowStart + 20);
    const rrnMatch = afterName.match(/(\d{6})(?!\d)/);
    if (rrnMatch) {
      out.rrnDetected = true;
      out.badges.rrn = "verify";
    }
  }

  // 전화번호 뒤 4자리 - "전화"/"끝번호"/"뒤 4자리" 문맥이 있을 때만 인식 (다른 4자리 숫자와 혼동 방지)
  const phoneMatch = text.match(/(?:전화|끝번호|뒤\s*4자리)[^\d]{0,10}(\d{4})(?!\d)/);
  if (phoneMatch) { out.phone4 = phoneMatch[1]; out.badges.phone4 = "confirmed"; }

  // 추천 FC: "***FC명" 마커를 최우선으로, 없으면 "추천:이름"/"추천 이름" 라벨, 없으면 대화체("이름 FC가...") fallback
  const labeledFcMatch =
    text.match(/추천\s*[:：]\s*([가-힣]{2,4})/) ||
    text.match(/추천\s+([가-힣]{2,4})(?!\s*(?:이|가|은|는|으로|FC))/);
  const conversationalFcMatch = text.match(/([가-힣]{2,4})\s*FC/);
  const fcMatch = fcMarkerMatch || labeledFcMatch || conversationalFcMatch;
  if (fcMatch) { out.fc = fcMatch[1]; out.badges.fc = fcMarkerMatch ? "confirmed" : "confirmed"; }

  // 단위가 명시된 금액 (백만원/만원)
  const explicitAmounts = [...text.matchAll(/(\d[\d,]*)\s*(백만원|만원)/g)];
  if (explicitAmounts.length) {
    out.fields["금액 언급"] = explicitAmounts.map(a => a[0]).join(", ");
    out.badges["금액 언급"] = "note";
  }

  // 단위 없는 숫자는 기본 단위를 백만원으로 추정 (금액 관련 키워드 근접 시에만, 오탐 방지를 위해 verify로 표시)
  const bareAmounts = [...text.matchAll(/(?:희망|대출|필요|정도|한도)[^\d]{0,4}(\d{1,4})(?!\s*(?:만원|백만원|%|월|일|시|분|년|개월))(?!\d)(?!\.\d)/g)];
  if (bareAmounts.length) {
    out.fields["금액 언급(단위 추정)"] = bareAmounts.map(a => `${a[1]}백만원`).join(", ");
    out.badges["금액 언급(단위 추정)"] = "verify";
  }

  const rateMatch = text.match(/(\d\.\d{1,2})\s*%/);
  if (rateMatch) { out.fields["금리"] = rateMatch[0]; out.badges["금리"] = "note"; }

  const collateralMatch = text.match(/([가-힣]{2,}(?:구|시|동)\s?[가-힣0-9\s]{2,20}(?:아파트|평형|단지))/);
  if (collateralMatch) { out.fields["담보"] = collateralMatch[0].trim(); out.badges["담보"] = "confirmed"; }

  const followUpMatch = text.match(/(일주일|1주일|한\s?달|10분|15분|열흘)\s?(뒤|후|이내)/);
  if (followUpMatch) { out.fields["Follow-up"] = followUpMatch[0]; out.badges["Follow-up"] = "confirmed"; }

  return out;
}

          {docPending.length === 0 && <Empty text='서류 확인이 필요한 고객이 없습니다. (예: 서류상태가 "안내 전"이나 "동의 대기"처럼 아직 완료되지 않았으면 여기 표시돼요)' />}
          {docPending.map(c => (
            <TaskRow key={c.id} title={c.name} sub={`서류상태: ${c.docStatus}`} tag={c.docStatus} tagColor={C.verify} tagBg={C.verifyBg} onClick={() => goCustomer(c.id)} onToggleHandled={() => markHandled(c.id, "docPending")} />
          ))}
        </Panel>
        </div>

        <Panel title="FC 연락 예정">
          {fcs.slice(0, 4).map(f => (
            <FcCallRow key={f.id} fc={f} onOpen={() => goFc(f.id)} />
          ))}
        </Panel>

        <div ref={needsVerifyRef}>
        <Panel title="확인 필요 상태" hint='고객상세의 상담정보 항목(상담유형·담보·상담일·최근연락일·서류상태) 중 하나라도 "확인 필요"로 표시된 경우'>
          {needsVerify.length === 0 && <Empty text='확인이 필요한 항목이 있는 고객이 없습니다. (고객상세에서 상담정보 배지를 "확인 필요"로 켜두면 여기 표시돼요)' />}
          {needsVerify.map(c => (
            <TaskRow key={c.id} title={c.name} sub={c.nextAction} tag={c.status} tagColor={STATUS_STYLE[c.status]?.fg} tagBg={STATUS_STYLE[c.status]?.bg} onClick={() => goCustomer(c.id)} onToggleHandled={() => markHandled(c.id, "needsVerify")} />
          ))}
        </Panel>
        </div>
      </div>
    </div>
  );
}

function StatCard({ icon: Icon, color, bg, label, value, onClick }) {
  const Tag = onClick ? "button" : "div";
  return (
    <Tag
      onClick={onClick}
      className="rounded-lg p-4 text-left w-full transition-colors"
      style={{ background: C.surface, border: `1px solid ${C.border}`, cursor: onClick ? "pointer" : "default" }}
      onMouseEnter={e => onClick && (e.currentTarget.style.background = C.surfaceAlt)}
      onMouseLeave={e => onClick && (e.currentTarget.style.background = C.surface)}
    >
      <div className="w-8 h-8 rounded-md flex items-center justify-center mb-3" style={{ background: bg }}>
        <Icon size={15} strokeWidth={1.75} color={color} />
      </div>
      <div className="text-[23px] font-semibold leading-none" style={mono}>{value}</div>
      <div className="text-[12px] mt-1.5 flex items-center gap-1" style={{ color: C.inkSoft }}>
        {label}
        {onClick && <ChevronRight size={12} color={C.inkFaint} />}

function Panel({ title, children, noPad, hint }) {
  return (
    <div className="rounded-lg overflow-hidden" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
      <div className={noPad ? "" : "p-5"}>
        {title && (
          <div className={noPad ? "px-4 pt-4" : "mb-4"}>
            <div className="text-[11px] font-semibold uppercase" style={{ color: C.inkSoft, letterSpacing: "0.07em" }}>{title}</div>
            {hint && <div className="text-[11px] mt-1 leading-relaxed" style={{ color: C.inkFaint }}>{hint}</div>}
          </div>
        )}
        <div className={noPad ? "" : "flex flex-col gap-1"}>{children}</div>

function TaskRow({ title, sub, tag, tagColor, tagBg, onClick, onToggleHandled, toggleMode = "beside" }) {
  return (
    <div
      className="flex items-center justify-between gap-3 py-2.5 px-2 rounded-lg transition-colors"
      onMouseEnter={e => onClick && (e.currentTarget.style.background = C.surfaceAlt)}
      onMouseLeave={e => onClick && (e.currentTarget.style.background = "transparent")}
    >
      <button onClick={onClick} disabled={!onClick} className="min-w-0 text-left flex-1" style={{ cursor: onClick ? "pointer" : "default" }}>
        <div className="text-[13.5px] font-medium truncate">{title}</div>
        <div className="text-[12px] truncate" style={{ color: C.inkSoft }}>{sub}</div>
      </button>
      <div className="flex items-center gap-2 shrink-0">
        {onToggleHandled && toggleMode === "replace" ? (
          <MiniToggle label={tag} onClick={onToggleHandled} />
        ) : (
          <>
            {tag && <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full" style={{ color: tagColor, background: tagBg }}>{tag}</span>}
            {onToggleHandled && <MiniToggle onClick={onToggleHandled} />}
          </>
        )}
      </div>
    </div>
  );
}

function MiniToggle({ label, onClick }) {
  const [on, setOn] = useState(false);
  return (
    <button
      type="button"
      onClick={(e) => { e.stopPropagation(); setOn(true); setTimeout(() => onClick(), 180); }}
      className="flex items-center gap-1.5"
      title="처리 완료로 표시하면 목록에서 사라져요"
    >
      {label && <span className="text-[11px] font-semibold" style={{ color: on ? C.confirmed : C.urgent }}>{label}</span>}
      <span
        className="inline-flex items-center rounded-full transition-colors"
        style={{ width: 30, height: 17, background: on ? C.confirmed : C.border, padding: 2 }}
      >
        <span
          className="rounded-full bg-white transition-transform"
          style={{ width: 13, height: 13, transform: on ? "translateX(13px)" : "translateX(0px)", boxShadow: "0 1px 2px rgba(0,0,0,0.25)" }}
        />
      </span>
    </button>
  );
}

/* ================= CUSTOMER LIST ================= */
const YEARS = [2026, 2027, 2028];
const MONTHS = Array.from({ length: 12 }, (_, i) => i + 1);

function CustomerList({ customers, onSelect }) {
  const [q, setQ] = useState("");
  const [openYear, setOpenYear] = useState(2026);
  const [selectedMonth, setSelectedMonth] = useState("전체"); // "전체" or "YYYY-MM"
  const [bucket, setBucket] = useState("전체");

  const countFor = (ym) => customers.filter(c => c.consultDate.slice(0, 7) === ym).length;
  const countForYear = (y) => customers.filter(c => c.consultDate.slice(0, 4) === String(y)).length;
  const countForBucket = (b) => customers.filter(c => getBucket(c.status) === b).length;

  const filtered = customers
    .filter(c => c.name.includes(q) || c.phone4.includes(q) || c.fc.includes(q) || c.status.includes(q))
    .filter(c => selectedMonth === "전체" || c.consultDate.slice(0, 7) === selectedMonth)
    .filter(c => bucket === "전체" || getBucket(c.status) === bucket)
    .slice()
    .sort((a, b) => new Date(b.consultDate) - new Date(a.consultDate));

  return (
    <div>
      <Header title="고객관리" subtitle={`총 ${customers.length}명의 고객이 등록되어 있습니다. · 상담일 최신순`} />

      <div className="flex flex-wrap gap-2 mb-4">
        <button
          onClick={() => setBucket("전체")}
          className="px-4 py-2.5 rounded-lg text-[13px] font-semibold"
          style={{ background: bucket === "전체" ? C.brand : C.surfaceAlt, color: bucket === "전체" ? "#FFFFFF" : C.ink }}
        >
          전체 <span className="text-[11px]" style={{ opacity: 0.8 }}>{customers.length}</span>
        </button>
        {BUCKETS.map(b => {
          const active = bucket === b;
          const s = BUCKET_STYLE[b];
          return (
            <button
              key={b}
              onClick={() => setBucket(active ? "전체" : b)}
              className="px-4 py-2.5 rounded-lg text-[13px] font-semibold flex items-center gap-1.5"
              style={{ background: active ? s.fg : s.bg, color: active ? "#FFFFFF" : s.fg }}
            >
              {b} <span className="text-[11px]" style={{ opacity: 0.8 }}>{countForBucket(b)}</span>
            </button>
          );
        })}
      </div>

      <div className="relative mb-4 max-w-sm">
        <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2" color={C.inkFaint} />
        <input
          value={q}
          onChange={e => setQ(e.target.value)}
          placeholder="이름, 전화번호, FC, 상태로 검색"
          className="w-full pl-9 pr-3 py-2.5 rounded-lg text-[13.5px] outline-none"
          style={{ background: C.surface, border: `1px solid ${C.border}` }}
        />
      </div>

      {/* Year / Month box navigator */}
      <div className="rounded-lg mb-4" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <div className="flex flex-wrap gap-2 p-3">
          <button
            onClick={() => { setSelectedMonth("전체"); }}
            className="px-3.5 py-2 rounded-md text-[13px] font-semibold"
            style={{ background: selectedMonth === "전체" ? C.brand : C.surfaceAlt, color: selectedMonth === "전체" ? "#FFFFFF" : C.ink }}
          >
            전체 기간
          </button>
          {YEARS.map(y => {
            const active = openYear === y;
            const n = countForYear(y);
            return (
              <button
                key={y}
                onClick={() => setOpenYear(active ? null : y)}
                className="px-3.5 py-2 rounded-md text-[13px] font-semibold flex items-center gap-1.5"
                style={{ background: active ? C.brand : C.surfaceAlt, color: active ? "#FFFFFF" : C.ink }}
              >
                {y}년
                <span className="text-[11px]" style={{ color: active ? "#C9A876" : C.inkFaint }}>{n}건</span>
                <ChevronRight size={13} style={{ transform: active ? "rotate(90deg)" : "none", transition: "transform 0.15s" }} />
              </button>
            );
          })}
        </div>

        {openYear && (
          <div className="px-3 pb-3 pt-1 grid grid-cols-4 sm:grid-cols-6 gap-2" style={{ borderTop: `1px solid ${C.border}` }}>
            {MONTHS.map(m => {
              const ym = `${openYear}-${String(m).padStart(2, "0")}`;
              const n = countFor(ym);
              const active = selectedMonth === ym;
              return (
                <button
                  key={m}
                  onClick={() => setSelectedMonth(active ? "전체" : ym)}
                  disabled={n === 0}
                  className="rounded-md py-2.5 text-center mt-2"
                  style={{
                    background: active ? C.accent : (n === 0 ? C.bg : C.confirmedBg),
                    color: active ? "#FFFFFF" : (n === 0 ? C.inkFaint : C.confirmed),
                    cursor: n === 0 ? "default" : "pointer",
                  }}
                >
                  <div className="text-[13px] font-semibold">{m}월</div>
                  <div className="text-[10.5px] mt-0.5" style={{ opacity: 0.85 }}>{n}건</div>
                </button>
              );
            })}
          </div>
        )}
      </div>

      <div className="rounded-lg overflow-hidden" style={{ border: `1px solid ${C.border}`, background: C.surface }}>
        {filtered.map((c, i) => (
          <button
            key={c.id}
            onClick={() => onSelect(c.id)}
            className="w-full flex items-center gap-4 px-4 py-3.5 text-left transition-colors"
            style={{ borderTop: i > 0 ? `1px solid ${C.border}` : "none" }}
            onMouseEnter={e => e.currentTarget.style.background = C.surfaceAlt}
            onMouseLeave={e => e.currentTarget.style.background = "transparent"}
          >
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2">
                <span className="text-[11.5px] shrink-0" style={{ ...mono, color: C.inkFaint }}>{c.consultDate}</span>
                <span className="text-[14px] font-semibold">{c.name}</span>
                <span className="text-[12px]" style={{ ...mono, color: C.inkFaint }}>****-{c.phone4}</span>
              </div>
              <div className="text-[12.5px] mt-0.5 truncate" style={{ color: C.inkSoft }}>
                {c.fc !== "-" ? `${c.fc} FC · ` : ""}{c.consultType}
              </div>
            </div>
            <StatusPill status={c.status} />
            <ChevronRight size={16} color={C.inkFaint} />
          </button>
        ))}
        {filtered.length === 0 && <Empty text="검색 결과가 없습니다." />}
      </div>
    </div>
  );
}

/* ================= CUSTOMER DETAIL ================= */
function CustomerDetail({ customer: c, onBack, onUpdate }) {
  const [status, setStatus] = useState(c.status);
  const [consultType, setConsultType] = useState(c.consultType);
  const [collateral, setCollateral] = useState(c.collateral);
  const [consultDate, setConsultDate] = useState(c.consultDate);
  const [lastContact, setLastContact] = useState(c.lastContact);
  const [docStatus, setDocStatus] = useState(c.docStatus);
  const [badges, setBadges] = useState(c.consultBadges || {
    consultType: "confirmed", collateral: "confirmed", consultDate: "confirmed", lastContact: "confirmed", docStatus: "verify",
  });
  const [notes, setNotes] = useState(c.notes);
  const [nextAction, setNextAction] = useState(c.nextAction);
  const [followUp, setFollowUp] = useState(c.followUp);
  const [saved, setSaved] = useState(false);

  const toggleBadge = (key) => setBadges(b => ({ ...b, [key]: b[key] === "confirmed" ? "verify" : "confirmed" }));

  const dirty =
    status !== c.status ||
    consultType !== c.consultType || collateral !== c.collateral || consultDate !== c.consultDate ||
    lastContact !== c.lastContact || docStatus !== c.docStatus || notes !== c.notes ||
    nextAction !== c.nextAction || followUp !== c.followUp ||
    JSON.stringify(badges) !== JSON.stringify(c.consultBadges || { consultType: "confirmed", collateral: "confirmed", consultDate: "confirmed", lastContact: "confirmed", docStatus: "verify" });

  function save() {
    onUpdate(c.id, { status, consultType, collateral, consultDate, lastContact, docStatus, consultBadges: badges, notes, nextAction, followUp });
    setSaved(true);
    setTimeout(() => setSaved(false), 1600);
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-5 flex-wrap gap-2">
        <button onClick={onBack} className="flex items-center gap-1.5 text-[13px]" style={{ color: C.inkSoft }}>
          <ArrowLeft size={15} /> 고객목록으로
        </button>
        {dirty && (
          <button onClick={save} className="flex items-center gap-1.5 px-3.5 py-2 rounded-md text-[13px] font-semibold text-white" style={{ background: saved ? C.confirmed : C.accent }}>
            <Save size={13} /> {saved ? "저장됨" : "변경사항 저장"}
          </button>
        )}
      </div>

      <div className="flex items-start justify-between mb-6 flex-wrap gap-3">
        <div>
          <div className="flex items-center gap-2.5">
            <h1 className="text-[21px] font-bold">{c.name}</h1>
            <span className="text-[13px]" style={{ ...mono, color: C.inkFaint }}>****-{c.phone4}</span>
          </div>
          <div className="text-[13px] mt-1" style={{ color: C.inkSoft }}>
            {c.fc !== "-" ? `추천 FC: ${c.fc} · ${c.branch}` : "직접 신청 (추천 FC 없음)"}
          </div>
        </div>
        <StatusSelector value={status} onChange={setStatus} />
      </div>

      <div className="grid lg:grid-cols-3 gap-5">
        <div className="lg:col-span-2 flex flex-col gap-5">
          <Panel title="상담 정보">
            <EditableRow label="상담유형" value={consultType} onChange={setConsultType} kind={badges.consultType} onToggleKind={() => toggleBadge("consultType")} />
            <EditableRow label="담보" value={collateral} onChange={setCollateral} kind={badges.collateral} onToggleKind={() => toggleBadge("collateral")} />
            <EditableRow label="상담일" value={consultDate} onChange={setConsultDate} kind={badges.consultDate} onToggleKind={() => toggleBadge("consultDate")} numeric type="date" />
            <EditableRow label="최근 연락일" value={lastContact} onChange={setLastContact} kind={badges.lastContact} onToggleKind={() => toggleBadge("lastContact")} numeric type="date" />
            <EditableRow label="서류상태" value={docStatus} onChange={setDocStatus} kind={badges.docStatus} onToggleKind={() => toggleBadge("docStatus")} />
            <div className="text-[11.5px] mt-2.5" style={{ color: C.inkFaint }}>
              배지를 눌러 확인됨 · 확인 필요 상태를 전환할 수 있어요.
            </div>
          </Panel>

          {Object.keys(c.fields).length > 0 && (
            <Panel title="대출 조건">
              {Object.entries(c.fields).map(([k, v]) => (
                <Field key={k} label={k} value={v} kind={c.badges[k] || "note"} numeric />
              ))}
              <div className="text-[11.5px] mt-2 flex items-start gap-1.5" style={{ color: C.inkFaint }}>
                <span>· <Badge kind="note" label="통화 안내" />는 통화 중 안내된 내용으로, 확정 상품조건과 구분해 관리합니다.</span>
              </div>
            </Panel>
          )}

          <Panel title="메모">
            <textarea
              value={notes}
              onChange={e => setNotes(e.target.value)}
              rows={4}
              className="w-full text-[13.5px] leading-relaxed p-2.5 rounded-md outline-none resize-none"
              style={{ color: C.ink, border: `1px solid ${C.border}`, background: C.surfaceAlt }}
            />
          </Panel>
        </div>

        <div className="flex flex-col gap-5">
          <Panel title="다음 행동">
            <div className="flex items-start gap-2 py-1">
              <CheckCircle2 size={16} color={C.brandSoft} className="mt-0.5 shrink-0" />
              <input
                value={nextAction}
                onChange={e => setNextAction(e.target.value)}
                className="w-full text-[13.5px] px-2 py-1.5 rounded-md outline-none"
                style={{ color: C.ink, border: `1px solid ${C.border}`, background: C.surfaceAlt }}
              />
            </div>
          </Panel>
          <Panel title="Follow-up">
            <div className="flex items-start gap-2 py-1">
              <Clock size={16} color={C.note} className="mt-0.5 shrink-0" />
              <input
                value={followUp}
                onChange={e => setFollowUp(e.target.value)}
                className="w-full text-[13.5px] px-2 py-1.5 rounded-md outline-none"
                style={{ color: C.ink, border: `1px solid ${C.border}`, background: C.surfaceAlt }}
              />
            </div>
          </Panel>
        </div>
      </div>
    </div>
  );
}

  const [justUpdated, setJustUpdated] = useState(false);

    if (!text.trim()) return;
    const wasResult = result !== null;
    setResult(parseSummary(text));
    setSaved(false);
    if (wasResult) {
      setJustUpdated(true);
      setTimeout(() => setJustUpdated(false), 1600);

      followUp: result.fields["Follow-up"] || "확인 필요",
      notes: text,
      fields: result.fields,
      badges: result.badges,

const INCOME_TYPES = ["근로소득자", "사업소득자", "연금소득자"];

function buildEmployeeDocs(cond) {
  const docs = [];

  // 항상 필요한 기본 서류
  docs.push({ label: "건강보험자격득실확인서", detail: "1개월 이내 발급분", kind: "confirmed", group: "재직 확인" });
  docs.push({ label: "재직증명서", detail: "1개월 이내 발급분", kind: "confirmed", group: "재직 확인" });
  docs.push({
    label: "소득 증빙서류 (택1)",
    detail: "근로소득원천징수영수증 · 소득금액증명원 · 소득확인증명서(SA용) · 소득세원천징수확인서(세무사발행) · 급여명세표/임금대장(직인 필수) 중 1종",
    kind: "confirmed", group: "소득 확인",
  });
  docs.push({
    label: "급여입금 통장 사본",
    detail: "소득발생기간 1개월 이상이나 실질수령액이 1개월 미만인 경우에만 추가",
    kind: "note", group: "소득 확인",
  });

  // 재직기간별
  if (cond.tenure === "3개월이하") {
    docs.push({ label: "재직 여부 유선확인 + 서명날인", detail: "재직 3개월 이하자는 필수 확인 절차", kind: "verify", group: "재직기간 조건" });
  }
  if (cond.tenure === "1개월~1년미만") {
    docs.push({
      label: "연환산 소득 적용",
      detail: cond.steadyIncome ? "상시소득으로 인정되어 100% 인정" : "상시소득 미인정 시 연환산 90%만 인정 (계약직·임시직은 상시소득 아님)",
      kind: "note", group: "재직기간 조건",
    });
    if (cond.highIncome && !cond.exemptGroup) {
      docs.push({ label: "최근 6개월 급여입금내역", detail: "연소득 5천만원 이상 & 재직 1년 미만은 증빙 강화 대상", kind: "verify", group: "재직기간 조건" });
    }
    if (cond.exemptGroup) {
      docs.push({ label: "증빙 강화 예외 적용", detail: "우량직장인·상장업체 근무자·전직장 소득자 20% 이내 등은 예외 가능 (세부 기준 확인 필요)", kind: "note", group: "재직기간 조건" });
    }
  }

  if (cond.onLeave) {
    docs.push({ label: "휴직 확인 서류", detail: "휴직 전 최근년도 소득으로 연소득 산정. 신청일 기준 최근 36개월 내 1개월 이상 연속 소득 없으면 추정소득 적용", kind: "note", group: "휴직/복직" });
  }
  if (cond.returned) {
    docs.push({ label: "복직 확인 서류", detail: "복직 후 최근년도 소득 기준 산정 (복직 3개월 미만이면 휴직자로 간주 선택 가능)", kind: "note", group: "휴직/복직" });
  }
  if (cond.combinePrevJob) {
    docs.push({ label: "전직장 소득 서류", detail: "전직장 퇴직월과 현직장 입사월이 1개월 이내인 경우 심사자 판단으로 합산 가능 (공무원·교사·계열사 전배 등)", kind: "verify", group: "전직장 소득" });
  }
  if (cond.overseas) {
    docs.push({ label: "해외소득 증빙 (최근 2개년)", detail: "해외공관 영사확인 또는 아포스티유 인증 필요", kind: "verify", group: "해외소득" });
  }

  return docs;
}

/* ---------- 고객 발송용 서류 체크리스트 ---------- */
const SEND_INCOME_OPTIONS = ["근로소득자", "사업소득자", "연금소득자", "기타"];

function buildSendChecklist(isPurchase, incomeCategory) {
  const items = [
    isPurchase ? "매매계약서" : "등기필증",
    "주민등록등본 1통",
    "초본 1통",
    "전입세대확인서",
    "외국인체류확인서 (주민센터 · 담보지 기준)",
    "인감증명서 1통",
    "인감도장",
    "신분증",
    "가족관계확인서",
  ];
  if (incomeCategory !== "기타") {
    items.push(`재직증명서 (${incomeCategory})`);
    items.push(`소득증명서 (${incomeCategory})`);
  }
  return items;
}

function SendChecklist() {
  const [isPurchase, setIsPurchase] = useState(false);
  const [incomeCategory, setIncomeCategory] = useState("근로소득자");
  const [copied, setCopied] = useState(false);

  const items = buildSendChecklist(isPurchase, incomeCategory);
  const plainText = `다음서류 준비 부탁드립니다.\n${items.join(", ")}`;

  function copy() {
    navigator.clipboard?.writeText(plainText).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    }).catch(() => {});
  }

  return (
    <Panel title="고객 발송용 서류 체크리스트">
      <div className="flex flex-col sm:flex-row gap-4 py-1 mb-1">
        <div className="flex-1">
          <div className="text-[12px] mb-2" style={{ color: C.inkSoft }}>대출용도</div>
          <div className="flex gap-1.5">
            <RadioRow label="구입" checked={isPurchase} onClick={() => setIsPurchase(true)} />
            <RadioRow label="그 외 (대환·생활자금 등)" checked={!isPurchase} onClick={() => setIsPurchase(false)} />
          </div>
        </div>
        <div className="flex-1">
          <div className="text-[12px] mb-2" style={{ color: C.inkSoft }}>소득유형</div>
          <div className="flex flex-wrap gap-1.5">
            {SEND_INCOME_OPTIONS.map(t => (
              <RadioRow key={t} label={t} checked={incomeCategory === t} onClick={() => setIncomeCategory(t)} />
            ))}
          </div>
        </div>
      </div>

      <div className="mt-3 pt-3" style={{ borderTop: `1px solid ${C.border}` }}>
        <div className="flex flex-col gap-1.5 mb-3">
          {items.map((item, i) => {
            const changed = i === 0 && isPurchase;
            const isIncomeDoc = item.includes("재직증명서") || item.includes("소득증명서");
            return (
              <div key={i} className="flex items-center gap-2 text-[13.5px]">
                <span className="w-5 shrink-0" style={{ ...mono, color: C.inkFaint }}>{i + 1}.</span>
                <span style={{ color: C.ink }}>{item}</span>
                {changed && <Badge kind="note" label="구입 조건 반영" />}
                {isIncomeDoc && <Badge kind="note" label="소득유형 반영" />}
              </div>
            );
          })}
          {incomeCategory === "기타" && (
            <div className="text-[12px] mt-1 flex items-start gap-1.5" style={{ color: C.inkFaint }}>
              <Info size={13} className="mt-0.5 shrink-0" />
              <span>소득유형을 "기타"로 선택하여 재직증명서 · 소득증명서 항목이 제외되었습니다.</span>
            </div>
          )}
        </div>

        <textarea
          readOnly
          value={plainText}
          rows={3}
          className="w-full resize-none outline-none text-[13px] leading-relaxed p-3 rounded-md"
          style={{ background: C.surfaceAlt, border: `1px solid ${C.border}`, color: C.ink }}
        />
        <button
          onClick={copy}
          className="mt-2 flex items-center gap-1.5 px-3.5 py-2 rounded-md text-[12.5px] font-semibold text-white"
          style={{ background: copied ? C.confirmed : C.accent }}
        >
          <FileCheck2 size={13} /> {copied ? "복사됨" : "텍스트 복사하기"}
        </button>
      </div>
    </Panel>
  );
}

function CheckRow({ label, checked, onClick }) {

function RateCalculator() {
  const [productId, setProductId] = useState(PRODUCTS[0].id);
  const [baseRate, setBaseRate] = useState(PRODUCTS[0].base);
  const [checks, setChecks] = useState({}); // { [id]: true/false }
  const [checkVals, setCheckVals] = useState({}); // { [id]: number } for variable items
  const [creditId, setCreditId] = useState("none");
  const [insuranceId, setInsuranceId] = useState("none");
  const [jeongyeolBp, setJeongyeolBp] = useState(0); // 0~30

  const product = PRODUCTS.find(p => p.id === productId);

  function changeProduct(id) {
    const p = PRODUCTS.find(x => x.id === id);
    setProductId(id);
    setBaseRate(p.base); // 상품 변경 시 표 기준금리로 초기화 (직접 수정 가능)
  }

  const basicRate = product.spread + (parseFloat(baseRate) || 0); // 기준금리(입력) + 가산금리(고정) = 기본금리

  const generalTotal = CHECK_ITEMS.reduce((sum, item) => {
    if (!checks[item.id]) return sum;
    const v = item.variable ? (checkVals[item.id] ?? item.value) : item.value;
    return sum + v;
  }, 0);
  const creditVal = CREDIT_OPTIONS.find(o => o.id === creditId).value;
  const insuranceVal = INSURANCE_OPTIONS.find(o => o.id === insuranceId).value;
  const jeongyeolVal = jeongyeolBp / 100;

  const rawTotal = generalTotal + creditVal + insuranceVal + jeongyeolVal;
  const maxAllowed = Math.min(MAX_DISCOUNT_CAP, product.spread, basicRate - MIN_RATE);
  const appliedTotal = Math.min(rawTotal, Math.max(maxAllowed, 0));
  const finalRate = Math.max(basicRate - appliedTotal, MIN_RATE);
  const capped = rawTotal > maxAllowed + 0.0001;

  return (
    <div>
      <Header title="금리계산기" subtitle={`대외비 · FC 전용 · ${RATE_PERIOD} 금리운용 기준`} />

      <div className="grid lg:grid-cols-3 gap-5 items-start">
        <div className="lg:col-span-2 flex flex-col gap-5">
          <StepTitle n={1} title="상품 선택" />
          <Panel>
            <select
              value={productId}
              onChange={e => changeProduct(e.target.value)}
              className="w-full px-3 py-2.5 rounded-md text-[14px] font-semibold outline-none mb-4"
              style={{ background: C.surfaceAlt, border: `1px solid ${C.border}`, color: C.ink }}
            >
              {PRODUCTS.map(p => <option key={p.id} value={p.id}>{p.name} ({p.type})</option>)}
            </select>

            <RateBuildRow
              label="기준금리"
              tag="직접입력" tagKind="accent"
              right={
                <div className="flex items-center gap-1.5">
                  <input
                    type="number" step="0.01" min="0" max="20"
                    value={baseRate}
                    onChange={e => setBaseRate(e.target.value === "" ? "" : parseFloat(e.target.value))}
                    className="w-[92px] text-right px-2 py-1.5 rounded-md outline-none text-[16px] font-bold"
                    style={{ ...mono, border: `1.5px solid ${C.border}`, color: C.brand, background: C.surface }}
                  />
                  <span className="text-[14px]" style={{ ...mono, color: C.inkSoft }}>%</span>
                </div>
              }
            />
            <div className="text-center text-[13px] py-1" style={{ color: "#B7C0CB", ...mono }}>+</div>
            <RateBuildRow
              label="가산금리"
              tag="표 고정" tagKind="muted"
              right={<span className="text-[16px] font-bold" style={{ color: C.inkSoft }}>{fmt(product.spread)}%</span>}
            />
            <div className="text-center text-[13px] py-1" style={{ color: "#B7C0CB", ...mono }}>=</div>
            <div className="flex items-center justify-between pt-2.5 mt-1" style={{ borderTop: `1.5px solid ${C.border}` }}>
              <span className="text-[14px]">기본금리</span>
              <span className="text-[22px] font-extrabold" style={{ ...mono, color: C.brand }}>{fmt(basicRate)}%</span>
            </div>
            <div className="text-right text-[11px] mt-2.5" style={{ ...mono, color: C.urgent }}>
              참고 · 표 기준 금리Band {fmt(product.bandLow)}~{fmt(product.bandHigh)}%
            </div>
          </Panel>

          <StepTitle n={2} title="일반할인 · 우대항목" />
          <Panel noPad>
            <div className="px-4 pt-3 pb-1 text-[10.5px] uppercase" style={{ ...mono, color: C.inkSoft, letterSpacing: "0.08em" }}>체크하여 적용</div>
            {CHECK_ITEMS.map(item => {
              const checked = !!checks[item.id];
              const val = checkVals[item.id] ?? item.value;
              return (
                <div key={item.id} className="flex items-center justify-between gap-2.5 px-4 py-2.5" style={{ borderBottom: `1px solid ${C.border}` }}>
                  <div className="flex items-center gap-2.5 flex-1 min-w-0">
                    <input
                      type="checkbox" checked={checked}
                      onChange={e => setChecks({ ...checks, [item.id]: e.target.checked })}
                      style={{ width: 18, height: 18, accentColor: C.brand }}
                    />
                    <label className="text-[13.5px] cursor-pointer" onClick={() => setChecks({ ...checks, [item.id]: !checked })}>{item.label}</label>
                    {item.variable && (
                      <select
                        disabled={!checked}
                        value={val}
                        onChange={e => setCheckVals({ ...checkVals, [item.id]: parseFloat(e.target.value) })}
                        className="text-[12px] rounded-md px-1.5 py-1 outline-none"
                        style={{ border: `1px solid ${C.border}`, background: C.surfaceAlt, color: C.ink }}
                      >
                        {item.options.map(o => <option key={o} value={o}>△{fmt(o)}</option>)}
                      </select>
                    )}
                  </div>
                  <div className="text-[13px] font-bold shrink-0" style={{ ...mono, color: checked ? C.confirmed : "#B7C0CB" }}>
                    △{fmt(checked ? val : item.value)}
                  </div>
                </div>
              );
            })}
          </Panel>

          <Panel noPad>
            <div className="px-4 pt-3 pb-1 text-[10.5px] uppercase" style={{ ...mono, color: C.inkSoft, letterSpacing: "0.08em" }}>신용평점 우량 / 대출우수 (중복 불가)</div>
            <TierRadioGroup options={CREDIT_OPTIONS} groupName="credit" value={creditId} onChange={setCreditId} />
          </Panel>

          <Panel noPad>
            <div className="px-4 pt-3 pb-1 text-[10.5px] uppercase" style={{ ...mono, color: C.inkSoft, letterSpacing: "0.08em" }}>보험할인 — 월보험료 또는 보험VIP (① or ②)</div>
            <TierRadioGroup options={INSURANCE_OPTIONS} groupName="insurance" value={insuranceId} onChange={setInsuranceId} />
          </Panel>

          <StepTitle n={3} title="전결할인 (가이드라인 조정)" />
          <Panel>
            <div className="flex items-baseline justify-between mb-1.5">
              <span className="text-[14px] font-bold">전결할인</span>
              <span className="text-[22px] font-extrabold" style={{ ...mono, color: C.accent }}>△{fmt(jeongyeolVal)}</span>
            </div>
            <div className="text-[11.5px] mb-3.5 leading-relaxed" style={{ color: C.inkSoft }}>최대전결 30bp · 적용 시 커버페이지(특이사항)에 사유 명기 필요</div>
            <input
              type="range" min={0} max={30} step={1} value={jeongyeolBp}
              onChange={e => setJeongyeolBp(parseInt(e.target.value, 10))}
              className="w-full" style={{ accentColor: C.accent, height: 6, cursor: "pointer" }}
            />
            <div className="flex justify-between text-[10.5px] mt-1" style={{ ...mono, color: "#B0BAC7" }}>
              <span>0.00</span><span>0.15</span><span>0.30</span>
            </div>
            {jeongyeolBp > 0 && (
              <div className="mt-3 text-[11.5px] rounded-md px-2.5 py-2" style={{ color: C.urgent, background: C.urgentBg }}>
                전결할인 적용배제 대상(신용평점 7구간 이하 / 신규·추가 2,000만원 미만·재대출 / 고위험군 / 프리론)은 적용 전 확인이 필요합니다.
              </div>
            )}
          </Panel>
        </div>

        {/* result column */}
        <div className="lg:sticky lg:top-6 flex flex-col gap-4">
          <div className="rounded-lg p-5 text-white" style={{ background: `linear-gradient(155deg, ${C.brand} 0%, #14171E 100%)` }}>
            <div className="text-[10.5px] uppercase mb-1" style={{ ...mono, letterSpacing: "0.1em", color: "#9FA6B4" }}>적용금리 (기본금리 − 총할인)</div>
            <div className="text-[32px] font-extrabold leading-none mb-4" style={{ ...mono, color: C.accentSoft }}>
              {fmt(finalRate)}<span className="text-[16px] ml-0.5">%</span>
            </div>
            <div className="flex items-center justify-between text-[12px] mb-3 pb-3" style={{ borderBottom: "1px solid rgba(255,255,255,0.12)" }}>
              <span style={{ color: "#9FA6B4" }}>기본금리</span>
              <span className="font-bold text-[14px]" style={mono}>{fmt(basicRate)}%</span>
            </div>
            <div className="grid grid-cols-2 gap-x-3 gap-y-2 text-[11px]" style={{ ...mono, color: "#B7C4D3" }}>
              <div>일반할인 <b style={{ color: "#EAF0F7" }}>{fmt(generalTotal)}</b></div>
              <div>신용/대출우수 <b style={{ color: "#EAF0F7" }}>{fmt(creditVal)}</b></div>
              <div>보험할인 <b style={{ color: "#EAF0F7" }}>{fmt(insuranceVal)}</b></div>
              <div>전결할인 <b style={{ color: "#EAF0F7" }}>{fmt(jeongyeolVal)}</b></div>
              <div className="col-span-2 pt-1.5 mt-0.5" style={{ borderTop: "1px solid rgba(255,255,255,0.12)" }}>
                총할인 <b style={{ color: C.accentSoft }}>{fmt(appliedTotal)}</b>
              </div>
            </div>
            {capped && (
              <div className="text-[10.5px] mt-3" style={{ color: "#E7B4A0" }}>
                ⚠ 최대 할인한도(가산금리·최저금리 기준)를 초과하여 한도까지만 적용되었습니다.
              </div>
            )}
          </div>

          <div className="text-[11.5px] leading-relaxed px-1 flex items-start gap-1.5" style={{ color: C.inkFaint }}>
            <Info size={13} className="mt-0.5 shrink-0" />
            <span>이 결과는 계산기 산출 예상금리이며, 통화상 안내금리·실제 심사 적용금리와 구분해 관리합니다. FC 내부 참고용이며 실제 적용 시 개별 조건 재확인이 필요합니다.</span>
          </div>
        </div>
      </div>
    </div>
  );
}
